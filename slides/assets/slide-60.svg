<?xml version="1.0" encoding="UTF-8"?>
<svg width="1472" height="677" xmlns="http://www.w3.org/2000/svg" viewBox="64 140 1472 676.6" ><rect x="80" y="150" width="900" height="607" fill="#0F1B2D" rx="10"/><text x="100" y="184.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#8FA6BF" xml:space="preserve"># B (eu-west) is primary since the failover; A (us-east) is fenced.</text><text x="100" y="207.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#8FA6BF" xml:space="preserve"># 1. Preserve evidence first: A may hold writes B never received</text><text x="100" y="230.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">aws ec2 create-snapshot --volume-id &quot;$A_DATA_VOL&quot; --description pre-failback</text><text x="100" y="253.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">cat &quot;$PGDATA_B&quot;/pg_wal/00000002.history   # LSN where B&#x27;s timeline forked</text><text x="100" y="276.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve"></text><text x="100" y="299.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#8FA6BF" xml:space="preserve"># 2. Rewind A onto B&#x27;s timeline (needs wal_log_hints=on or data checksums)</text><text x="100" y="322.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">pg_ctl -D &quot;$PGDATA_A&quot; stop -m fast</text><text x="100" y="345.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">pg_rewind --target-pgdata=&quot;$PGDATA_A&quot; \</text><text x="100" y="368.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#8FA6BF" xml:space="preserve">          --source-server=&quot;host=db-b.eu-west user=postgres&quot; --progress</text><text x="100" y="391.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#8FA6BF" xml:space="preserve"># if rewind fails: fresh pg_basebackup from B instead</text><text x="100" y="414.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve"></text><text x="100" y="437.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#8FA6BF" xml:space="preserve"># 3. Start A as a streaming replica of B</text><text x="100" y="460.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">touch &quot;$PGDATA_A&quot;/standby.signal</text><text x="100" y="483.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">echo &quot;primary_conninfo=&#x27;host=db-b.eu-west user=replicator&#x27;&quot; \</text><text x="100" y="506.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">     &gt;&gt; &quot;$PGDATA_A&quot;/postgresql.auto.conf</text><text x="100" y="529.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">pg_ctl -D &quot;$PGDATA_A&quot; start</text><text x="100" y="552.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve"></text><text x="100" y="575.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#8FA6BF" xml:space="preserve"># 4. Catch up and rehydrate us-east; watch lag on B</text><text x="100" y="598.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">psql -h db-b -c &quot;SELECT client_addr, replay_lag FROM pg_stat_replication&quot;</text><text x="100" y="621.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve"></text><text x="100" y="644.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#8FA6BF" xml:space="preserve"># 5. Switchover window: stop writes on B, lag = 0, promote A</text><text x="100" y="667.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">psql -h db-b -c &quot;ALTER SYSTEM SET default_transaction_read_only=on&quot;</text><text x="100" y="690.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">psql -h db-b -c &quot;SELECT pg_reload_conf()&quot;   # + kill app sessions</text><text x="100" y="713.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">psql -h db-a -c &quot;SELECT pg_promote()&quot;</text><text x="100" y="736.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#8FA6BF" xml:space="preserve"># 6. Re-point B at A as a replica; shift traffic back gradually</text><text x="1024" y="175.6" text-anchor="start" font-size="20.8" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#B85042" font-weight="700">WHAT</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#B85042" font-weight="700"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#B85042" font-weight="700">TO</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#B85042" font-weight="700"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#B85042" font-weight="700">NOTICE</tspan></text><text x="1024" y="220.9" font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" font-size="28.3" fill="#0B6B6F">•</text><text x="1057" y="220.9" text-anchor="start" font-size="28.3" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700">Evidence</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700">first</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">:</tspan><tspan font-family="Consolas, DeckMono, Menlo, monospace" fill="#B85042"> </tspan><tspan font-family="Consolas, DeckMono, Menlo, monospace" fill="#B85042">pg_rewind</tspan></text><text x="1057" y="255.5" text-anchor="start" font-size="28.3" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">discards</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">A&#x27;s</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">divergent</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">changes,</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">so</tspan></text><text x="1057" y="290.1" text-anchor="start" font-size="28.3" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">snapshot</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">and</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">extract</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">them</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">before</tspan></text><text x="1024" y="337.2" font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" font-size="28.3" fill="#0B6B6F">•</text><text x="1057" y="337.2" text-anchor="start" font-size="28.3" xml:space="preserve"><tspan font-family="Consolas, DeckMono, Menlo, monospace" fill="#B85042">pg_rewind</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">copies</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">only</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">changed</tspan></text><text x="1057" y="371.8" text-anchor="start" font-size="28.3" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">blocks:</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">minutes</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">instead</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">of</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">a</tspan></text><text x="1057" y="406.4" text-anchor="start" font-size="28.3" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">multi-TB</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">base</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">backup</tspan></text><text x="1024" y="453.6" font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" font-size="28.3" fill="#0B6B6F">•</text><text x="1057" y="453.6" text-anchor="start" font-size="28.3" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">Promote</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">only</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">at</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700">lag</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700">=</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700">0</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">inside</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">a</tspan></text><text x="1057" y="488.2" text-anchor="start" font-size="28.3" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">write</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">freeze:</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">a</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">planned</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">switchover</tspan></text><text x="1057" y="522.8" text-anchor="start" font-size="28.3" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">has</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">RPO</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">0</tspan></text><text x="1024" y="570" font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" font-size="28.3" fill="#0B6B6F">•</text><text x="1057" y="570" text-anchor="start" font-size="28.3" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">Compare</tspan></text><text x="1057" y="604.6" text-anchor="start" font-size="28.3" xml:space="preserve"><tspan font-family="Consolas, DeckMono, Menlo, monospace" fill="#B85042">pg_current_wal_lsn()</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">on</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">B</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">with</tspan></text><text x="1057" y="639.2" text-anchor="start" font-size="28.3" xml:space="preserve"><tspan font-family="Consolas, DeckMono, Menlo, monospace" fill="#B85042">pg_last_wal_replay_lsn()</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">on</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">A</tspan></text><text x="1057" y="673.8" text-anchor="start" font-size="28.3" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">before</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">promoting</tspan></text><text x="1024" y="721" font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" font-size="28.3" fill="#0B6B6F">•</text><text x="1057" y="721" text-anchor="start" font-size="28.3" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">B</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">becomes</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">a</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">replica:</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">your</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">rollback</tspan></text><text x="1057" y="755.6" text-anchor="start" font-size="28.3" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">path</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">if</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">A</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">misbehaves</tspan></text></svg>