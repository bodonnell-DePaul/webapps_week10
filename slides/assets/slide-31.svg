<?xml version="1.0" encoding="UTF-8"?>
<svg width="1472" height="677" xmlns="http://www.w3.org/2000/svg" viewBox="64 140 1472 676.6" ><rect x="80" y="150" width="860" height="515" fill="#0F1B2D" rx="10"/><text x="100" y="184.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#8FA6BF" xml:space="preserve">-- 1. Never wait in a lock queue behind a long transaction</text><text x="100" y="207.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">SET lock_timeout = &#x27;2s&#x27;;      -- retry later instead</text><text x="100" y="230.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">SET statement_timeout = &#x27;15min&#x27;;</text><text x="100" y="253.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve"></text><text x="100" y="276.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#8FA6BF" xml:space="preserve">-- 2. Additive change: metadata-only (PG 11+ even with a constant default)</text><text x="100" y="299.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">ALTER TABLE orders ADD COLUMN region text;</text><text x="100" y="322.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve"></text><text x="100" y="345.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#8FA6BF" xml:space="preserve">-- 3. Index without blocking writes (cannot run inside a transaction)</text><text x="100" y="368.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">CREATE INDEX CONCURRENTLY orders_region_idx ON orders (region);</text><text x="100" y="391.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve"></text><text x="100" y="414.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#8FA6BF" xml:space="preserve">-- 4. Constraint in two steps: cheap add, then online validation</text><text x="100" y="437.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">ALTER TABLE orders ADD CONSTRAINT region_ok</text><text x="100" y="460.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">  CHECK (region IN (&#x27;us&#x27;, &#x27;eu&#x27;, &#x27;ap&#x27;)) NOT VALID;</text><text x="100" y="483.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">ALTER TABLE orders VALIDATE CONSTRAINT region_ok;</text><text x="100" y="506.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve"></text><text x="100" y="529.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#8FA6BF" xml:space="preserve">-- 5. Backfill in small, resumable batches</text><text x="100" y="552.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">UPDATE orders SET region = &#x27;us&#x27;</text><text x="100" y="575.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">WHERE id IN (SELECT id FROM orders</text><text x="100" y="598.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">             WHERE region IS NULL AND id &gt; :hwm</text><text x="100" y="621.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#E8EEF5" xml:space="preserve">             ORDER BY id LIMIT 5000);</text><text x="100" y="644.4" font-family="Consolas, DeckMono, Menlo, monospace" font-size="19.2" fill="#8FA6BF" xml:space="preserve">-- commit, record :hwm, sleep, check replica lag, repeat</text><text x="984" y="176.3" text-anchor="start" font-size="21.7" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#B85042" font-weight="700">WHAT</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#B85042" font-weight="700"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#B85042" font-weight="700">TO</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#B85042" font-weight="700"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#B85042" font-weight="700">NOTICE</tspan></text><text x="984" y="224" font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" font-size="30" fill="#0B6B6F">•</text><text x="1018" y="224" text-anchor="start" font-size="30" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">A</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">blocked</tspan><tspan font-family="Consolas, DeckMono, Menlo, monospace" fill="#B85042"> </tspan><tspan font-family="Consolas, DeckMono, Menlo, monospace" fill="#B85042">ALTER</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700">queues</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700">every</tspan></text><text x="1018" y="260.6" text-anchor="start" font-size="30" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700">later</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033" font-weight="700">query</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">behind</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">it:</tspan></text><text x="1018" y="297.2" text-anchor="start" font-size="30" xml:space="preserve"><tspan font-family="Consolas, DeckMono, Menlo, monospace" fill="#B85042">lock_timeout</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">turns</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">an</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">outage</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">into</tspan></text><text x="1018" y="333.8" text-anchor="start" font-size="30" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">a</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">retry</tspan></text><text x="984" y="383.8" font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" font-size="30" fill="#0B6B6F">•</text><text x="1018" y="383.8" text-anchor="start" font-size="30" xml:space="preserve"><tspan font-family="Consolas, DeckMono, Menlo, monospace" fill="#B85042">CONCURRENTLY</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">can</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">fail</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">and</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">leave</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">an</tspan></text><text x="1018" y="420.4" text-anchor="start" font-size="30" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">INVALID</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">index;</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">check</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">and</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">rebuild</tspan></text><text x="984" y="470.4" font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" font-size="30" fill="#0B6B6F">•</text><text x="1018" y="470.4" text-anchor="start" font-size="30" xml:space="preserve"><tspan font-family="Consolas, DeckMono, Menlo, monospace" fill="#B85042">NOT</tspan><tspan font-family="Consolas, DeckMono, Menlo, monospace" fill="#B85042"> </tspan><tspan font-family="Consolas, DeckMono, Menlo, monospace" fill="#B85042">VALID</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">skips</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">the</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">full</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">scan</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">while</tspan></text><text x="1018" y="507" text-anchor="start" font-size="30" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">taking</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">the</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">strong</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">lock</tspan></text><text x="984" y="557" font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" font-size="30" fill="#0B6B6F">•</text><text x="1018" y="557" text-anchor="start" font-size="30" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">Batches</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">keep</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">locks,</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">WAL</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">volume,</tspan></text><text x="1018" y="593.6" text-anchor="start" font-size="30" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">and</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">replica</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">lag</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">bounded</tspan></text><text x="984" y="643.6" font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" font-size="30" fill="#0B6B6F">•</text><text x="1018" y="643.6" text-anchor="start" font-size="30" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">Drop</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">columns</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">last,</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">after</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">no</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">code</tspan></text><text x="1018" y="680.2" text-anchor="start" font-size="30" xml:space="preserve"><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">reads</tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033"> </tspan><tspan font-family="Aptos, DeckHelv, DeckArial, 'Segoe UI', sans-serif" fill="#172033">them</tspan></text></svg>